upstream backend {
    server backend:8081;
}

# WebSocket upgrade: apply only when the client requests it.
# NOTE: map is only valid at the http level, not inside server blocks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit zones. Authentication endpoints are the ones worth brute forcing;
# the application enforces its own limits as well, this is the outer bound.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

# Metrics endpoint for nginx-prometheus-exporter.
#
# Plain HTTP on 8080, reachable only from the compose network: this port is
# never published to the host and never proxied from the 443 server block, so
# stub_status cannot be read from the internet. The listen address is further
# restricted to the container's own interfaces by Docker's network isolation.
server {
    listen 8080;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
        # Belt and braces: only the private ranges Docker hands out.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name moya-usluga.ru www.moya-usluga.ru 94.103.9.172 localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploaded attachments are capped at 25 MB by the backend.
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The SPA had no CSP at all, which is what let a component inject a script
    # from unpkg into the app's origin. Everything the app needs is now bundled,
    # so scripts and styles come from here only. connect-src keeps the API and
    # the chat WebSocket reachable; img-src allows the map tiles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Common proxy settings reused by API locations.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # All backend API endpoints are mounted under /api. Proxy everything
    # under /api/ (including the chat WebSocket at /api/chats/{id}/ws) to the
    # backend. This cleanly separates API calls from SPA routes served below.
    # Authentication endpoints: tighter limit, small burst for retries.
    location ~ ^/api/(login|register|auth/forgot-password|auth/reset-password)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check is exposed without the /api prefix so it can be pinged.
    location = /health {
        proxy_pass http://backend;
    }

    # Release APK files are served by the backend directly.
    location ^~ /releases/ {
        proxy_pass http://backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Uploaded media and documents. The backend authorizes every request and
    # verifies that the caller participates in the conversation the file belongs
    # to, so these must not be cached by shared caches.
    location ^~ /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "private, no-store" always;
    }

    # SPA: every other path falls through to index.html so client-side routes
    # like /login, /admin/users, /customer, /executor work on full page reload.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Assets with hashed filenames can be cached indefinitely because their
    # URL changes on every build.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so the browser always fetches the
    # latest asset manifest after a new deployment.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
