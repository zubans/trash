upstream backend {
    server backend:8081;
}

# WebSocket upgrade: apply only when the client requests it.
# NOTE: map is only valid at the http level, not inside server blocks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name moya-usluga.ru www.moya-usluga.ru 94.103.9.172 localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Common proxy settings reused by API locations.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # All backend API endpoints are mounted under /api. Proxy everything
    # under /api/ (including the chat WebSocket at /api/chats/{id}/ws) to the
    # backend. This cleanly separates API calls from SPA routes served below.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check is exposed without the /api prefix so it can be pinged.
    location = /health {
        proxy_pass http://backend;
    }

    # Release APK files are served by the backend directly.
    location ^~ /releases/ {
        proxy_pass http://backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Uploaded media and document files are served by the backend directly.
    location ^~ /uploads/ {
        proxy_pass http://backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA: every other path falls through to index.html so client-side routes
    # like /login, /admin/users, /customer, /executor work on full page reload.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Assets with hashed filenames can be cached indefinitely because their
    # URL changes on every build.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so the browser always fetches the
    # latest asset manifest after a new deployment.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
