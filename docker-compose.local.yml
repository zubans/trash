# Локальный запуск всей системы одной командой:
#
#   make local-up
#
# Без make — сначала .env.local и сертификаты, без них не стартуют ни nginx,
# ни бэкенд:
#
#   cp .env.local.example .env.local
#   make local-certs
#   docker compose --env-file .env.local -f docker-compose.local.yml up -d --build
#
# Отдельный compose-проект (healthlogin-local), чтобы не пересекаться с
# прод-образным стеком из docker-compose.yml. Одновременно они не работают:
# оба занимают порты 8443/8088 — перед локальным запуском выполните make stop.
#
# Отличия от прод-стека, все намеренные:
#   - вместо почтового сервера maddy — Mailpit: письма наружу не уходят,
#     их видно в веб-интерфейсе на http://127.0.0.1:8025;
#   - Postgres опубликован на 127.0.0.1:5432 для psql/IDE (в проде порт
#     не публикуется вовсе);
#   - nginx терминирует TLS самоподписанным localhost-сертификатом
#     (nginx.local.conf), а не боевым сертификатом moya-usluga.ru;
#   - мониторинг облегчённый: Prometheus + Grafana + экспортеры БД и nginx.
#     Alertmanager, ops-бот, node-exporter, cadvisor и blackbox здесь не
#     нужны — они про продакшен и Telegram-алерты;
#   - секреты имеют dev-дефолты: JWT_SECRET, пароль БД и Grafana заданы
#     в .env.local.example, ничего генерировать не обязательно.

name: healthlogin-local

services:
  db:
    image: postgres:16-alpine
    container_name: healthlogin_local_db
    environment:
      POSTGRES_USER: ${DB_USER:-healthlogin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthlogin}
      POSTGRES_DB: ${DB_NAME:-healthlogin}
    # Миграции применяет бэкенд при старте (repository.Migrate), как и в проде.
    # Тюнинг скромнее продового: локальная машина делит память с IDE и браузером.
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=500ms
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    # Только loopback: база нужна с хоста для psql и IDE, но не соседям по сети.
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"

  # Почтовый перехватчик вместо maddy. Бэкенд шлёт сюда по SMTP без
  # аутентификации (mailer.go умеет работать без логина/пароля), а письма —
  # подтверждение почты, код сброса пароля — читаются в веб-интерфейсе.
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: healthlogin_local_mail
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthlogin_local_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-healthlogin}
      DB_PASSWORD: ${DB_PASSWORD:-healthlogin}
      DB_NAME: ${DB_NAME:-healthlogin}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      AUTH_CACHE_TTL_SEC: ${AUTH_CACHE_TTL_SEC:-5}
      SETTINGS_CACHE_TTL_SEC: ${SETTINGS_CACHE_TTL_SEC:-10}
      CATALOG_CACHE_TTL_SEC: ${CATALOG_CACHE_TTL_SEC:-60}
      DADATA_MAX_CONCURRENCY: ${DADATA_MAX_CONCURRENCY:-8}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:8443}
      # Локальный дефолт вместо обязательной переменной: стек должен подниматься
      # без генерации секретов. Боевой JWT_SECRET сюда не попадает никогда.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      # Сертификаты генерирует `make local-certs` (уже лежат в certs/ у тех, кто
      # запускал стек раньше). Без них бэкенд всё равно стартует — plain HTTP.
      TLS_CERT_FILE: /app/certs/localhost-cert.pem
      TLS_KEY_FILE: /app/certs/localhost-key.pem
      MOBILE_HTTP_ADDR: :8081
      LEGACY_ROOT_ROUTES: ${LEGACY_ROOT_ROUTES:-1}
      RELEASES_BASE_URL: ${RELEASES_BASE_URL:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      ACCEPT_RADIUS_KM: ${ACCEPT_RADIUS_KM:-0.5}
      # Необязательно локально: без ключа /geo/suggest отвечает 503, остальное
      # работает. В проде переменная обязательна именно потому, что без неё
      # нельзя завершить регистрацию.
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      # Mailpit: без аутентификации, порт 1025.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ${SMTP_FROM:-system@localhost}
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost:8443}
      METRICS_ADDR: ${METRICS_ADDR:-:9091}
      APP_VERSION: local-dev
    depends_on:
      - db
      - mailpit
    volumes:
      - ./releases:/app/releases
      - uploads_local_data:/app/uploads
      - ./certs:/app/certs:ro
    expose:
      - "8081"
      - "9091"
    ports:
      - "127.0.0.1:8088:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: healthlogin_local_frontend
    depends_on:
      - backend
    volumes:
      # Локальный конфиг поверх продового из образа: server_name localhost и
      # самоподписанный сертификат вместо боевого.
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"

  # --- Мониторинг ------------------------------------------------------------
  # Облегчённая версия docker-compose.monitoring.yml. Те же дашборды Grafana
  # (монтируются из monitoring/grafana/dashboards), тот же Prometheus major.

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: healthlogin_local_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_local_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: healthlogin_local_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      # Локальный provisioning: только Prometheus, без Alertmanager-источника,
      # которого в этом стеке нет. Дашборды — те же, что в проде.
      - ./monitoring/grafana/provisioning.local:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_local_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: healthlogin_local_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-healthlogin}:${DB_PASSWORD:-healthlogin}@db:5432/${DB_NAME:-healthlogin}?sslmode=disable"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    expose:
      - "9187"
    depends_on:
      - db

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: healthlogin_local_nginx_exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://frontend:8080/stub_status
    expose:
      - "9113"
    depends_on:
      - frontend

volumes:
  postgres_local_data:
    driver: local
  uploads_local_data:
    driver: local
  prometheus_local_data:
    driver: local
  grafana_local_data:
    driver: local

networks:
  default:
    driver: bridge
