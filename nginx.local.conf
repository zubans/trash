# Локальный вариант nginx.conf для docker-compose.local.yml.
# Отличия от продового конфига:
#   - server_name localhost вместо moya-usluga.ru;
#   - самоподписанный localhost-сертификат (его генерирует `make local-certs`);
#   - нет HSTS: с самоподписанным сертификатом он только мешает — браузер
#     запоминает политику и потом не пускает даже после смены сертификата.
# Остальное — rate limits, CSP, проксирование /api, WebSocket, SPA-fallback —
# повторяет прод, чтобы локальное поведение не расходилось с боевым.

upstream backend {
    server backend:8081;
}

# WebSocket upgrade: apply only when the client requests it.
# NOTE: map is only valid at the http level, not inside server blocks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit zones. Authentication endpoints are the ones worth brute forcing;
# the application enforces its own limits as well, this is the outer bound.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

# Metrics endpoint for nginx-prometheus-exporter.
#
# Plain HTTP on 8080, reachable only from the compose network: this port is
# never published to the host and never proxied from the 443 server block.
server {
    listen 8080;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost-cert.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploaded attachments are capped at 25 MB by the backend.
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same CSP as production: everything the app needs is bundled, connect-src
    # keeps the API and the chat WebSocket reachable, img-src allows map tiles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Common proxy settings reused by API locations.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Authentication endpoints: tighter limit, small burst for retries.
    location ~ ^/api/(login|register|auth/forgot-password|auth/reset-password)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check is exposed without the /api prefix so it can be pinged.
    location = /health {
        proxy_pass http://backend;
    }

    # Release APK files are served by the backend directly.
    location ^~ /releases/ {
        proxy_pass http://backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Uploaded media and documents, authorized by the backend per request.
    location ^~ /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "private, no-store" always;
    }

    # SPA: every other path falls through to index.html so client-side routes
    # like /login, /admin/users, /customer, /executor work on full page reload.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Assets with hashed filenames can be cached indefinitely because their
    # URL changes on every build.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so the browser always fetches the
    # latest asset manifest after a new deployment.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
