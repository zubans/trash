name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The application deploy and the monitoring deploy run as parallel jobs against
# the same server directory. Two *runs* doing that at the same time is a
# different matter, so runs are serialised and the newer one waits rather than
# cancelling: a half-applied deploy is worse than a slow one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/healthlogin-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/healthlogin-frontend

jobs:
  # Which half of the stack did this push actually touch?
  #
  # The monitoring containers are deployed by their own job, so a push that only
  # changes Prometheus rules, a dashboard or the prober has no business
  # rebuilding the backend image, restarting the application and rebuilding the
  # Android APK. The test is deliberately a deny-list — "everything here is
  # monitoring-only, so skip the app deploy" — rather than an allow-list of app
  # paths: an unrecognised file then deploys as it always has, instead of
  # silently not deploying at all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The diff needs the commit this push started from.
          fetch-depth: 0

      - name: Detect which parts changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Paths that only ever affect the monitoring stack. backend/metrics/
          # is deliberately absent: it is compiled into the backend binary, so a
          # change there is an application change.
          ONLY_MONITORING='^(monitoring/|docker-compose\.monitoring\.yml$|doc/monitoring\.md$)'
          # Paths that should redeploy monitoring. Wider than the set above: the
          # opsbot shares a Go module with the backend and is started by the
          # Makefile, so both move it.
          TOUCHES_MONITORING='^(monitoring/|docker-compose\.monitoring\.yml$|backend/go\.(mod|sum)$|Makefile$)'

          run_all() {
            echo "Deploying both halves."
            echo "app=true"        >> "$GITHUB_OUTPUT"
            echo "monitoring=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Manual runs, first pushes and force pushes have no usable base to
          # diff against. Deploying everything is the safe reading of "we do not
          # know what changed".
          #
          # These are `if` blocks rather than `cond && run_all`: under
          # `set -e` a false one-liner test is itself a failing command and
          # would abort the job.
          if [ "$EVENT" != "push" ]; then
            echo "Event is $EVENT, not a push."
            run_all
          fi
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000)
              echo "No base commit for this push."
              run_all
              ;;
          esac
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Base commit $BEFORE is not in this clone (force push?)."
            run_all
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          if [ -z "$CHANGED" ]; then
            echo "Diff is empty."
            run_all
          fi
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -qvE "$ONLY_MONITORING"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only monitoring paths changed: skipping the application deploy."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE "$TOUCHES_MONITORING"; then
            echo "monitoring=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under monitoring changed: leaving it running as is."
            echo "monitoring=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify Backend Builds
        run: |
          cd backend
          go build ./...

      - name: Vet Backend
        run: |
          cd backend
          go vet ./...

      - name: Run Backend Tests
        run: |
          cd backend
          go test -race ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed once, before both steps that need node_modules.
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck Frontend
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd frontend
          npx vitest run

  build-and-push:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.app == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOCKER_USERNAME,DB_USER,DB_PASSWORD,DB_NAME,JWT_SECRET,SMTP_PASSWORD,SMTP_USER,SMTP_HOST,CORS_ORIGIN,APP_BASE_URL,DADATA_API_KEY
          script: |
            set -e
            cd /home/user/.openclaw/workspace/worktrees/trash || exit 1
            echo "Fetching latest repository files..."
            # This checkout is a mirror of origin, not a branch with its own
            # history, so it is forced to match rather than merged.
            #
            # `git pull` required the server's main to be a fast-forward of
            # origin's, and two ordinary situations break that. Local commits on
            # the server make the branches divergent, and pull refuses to guess
            # between merge and rebase — that is what stopped this deploy. A
            # failed `make release-android` is the other way in: it aborts
            # before restoring frontend/android/app/build.gradle from its .bak,
            # and pull then refuses to overwrite the local change. Neither is
            # something to reconcile, because the server has nothing to
            # contribute back.
            #
            # The monitoring deploy runs at the same time and shares this
            # checkout, so the update — and only the update — is serialised
            # between the two jobs. Fetch and reset go under one lock, so the
            # other job can never land between them.
            #
            # Discarded commits stay recoverable: the pre-reset SHA is printed
            # here and kept in the reflog.
            echo "Server checkout was at $(git rev-parse HEAD)"
            flock /tmp/healthlogin-deploy-git.lock sh -c 'git fetch origin main && git reset --hard FETCH_HEAD'
            echo "Server checkout now at $(git rev-parse HEAD)"
            
            # Write production .env file from GitHub Actions secrets & variables
            echo "Writing production .env file from GitHub Secrets..."
            printf "DOCKER_USERNAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_NAME=%s\nJWT_SECRET=%s\nSMTP_PASSWORD=%s\nSMTP_USER=%s\nSMTP_HOST=%s\nCORS_ORIGIN=%s\nAPP_BASE_URL=%s\nDADATA_API_KEY=%s\n" \
              "${DOCKER_USERNAME}" \
              "${DB_USER:-healthlogin}" \
              "${DB_PASSWORD}" \
              "${DB_NAME:-healthlogin}" \
              "${JWT_SECRET}" \
              "${SMTP_PASSWORD}" \
              "${SMTP_USER:-system@moya-usluga.ru}" \
              "${SMTP_HOST:-mailserver}" \
              "${CORS_ORIGIN:-https://moya-usluga.ru}" \
              "${APP_BASE_URL:-https://moya-usluga.ru}" \
              "${DADATA_API_KEY}" > .env
            chmod 600 .env

            echo "Restarting services via make restart..."
            make restart
            
            echo "Building and releasing new Android APK on server..."
            # Заголовок коммита (%s), а не всё сообщение (%B). Эти заметки
            # показываются пользователю в диалоге обновления, и там нужна одна
            # строка о том, что изменилось, а не разбор причин на тридцать строк.
            COMMIT_MSG=$(git log -1 --pretty=%s)
            make release-android RELEASE_NOTES="${COMMIT_MSG}" || echo "Notice: Android release build skipped or failed on server."
            
            echo "Cleaning up old images..."
            docker image prune -af --filter "until=168h"
            
            echo "Deployment finished successfully."
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER }}
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || secrets.CORS_ORIGIN }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.APP_BASE_URL }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}

  # Monitoring is deployed by its own job, in parallel with `deploy`.
  #
  # It is not downstream of build-and-push because nothing here ships in the
  # application images: Prometheus, Grafana and the exporters are upstream
  # images, and the opsbot is built on the server from this checkout. It is
  # downstream of `test` because the opsbot is compiled from the same Go
  # module as the backend.
  #
  # Nothing in this job restarts the application. `make monitoring-up` passes
  # --no-deps precisely so that it cannot, even while `deploy` is mid-restart.
  deploy-monitoring:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.monitoring == 'true'
    steps:
      - name: Deploy monitoring stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,GRAFANA_ROOT_URL,OPS_KEY,OPSBOT_ALLOWED_CHATS,OPSBOT_ALLOWED_USERS
          script: |
            set -e
            cd /home/user/.openclaw/workspace/worktrees/trash || exit 1
            echo "Fetching latest repository files..."
            # Same forced update as the application deploy, under the same lock —
            # see the comment there for why this is a reset and not a pull.
            echo "Server checkout was at $(git rev-parse HEAD)"
            flock /tmp/healthlogin-deploy-git.lock sh -c 'git fetch origin main && git reset --hard FETCH_HEAD'
            echo "Server checkout now at $(git rev-parse HEAD)"

            # The monitoring stack reads the database password and the endpoint
            # keys from the application's .env. It is written by the deploy job
            # and persists between runs, so a monitoring-only push finds it
            # already there — but say so plainly if it is missing rather than
            # failing later inside Compose.
            if [ ! -f .env ]; then
              echo "ERROR: .env is missing. Run the application deploy once first." >&2
              exit 1
            fi

            # Monitoring secrets go in their own file: the application deploy
            # rewrites .env wholesale, and appending to it would lose these on
            # the next run — or, worse, half-lose them mid-race.
            echo "Writing .env.monitoring from GitHub Secrets..."
            printf "TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\nGRAFANA_ADMIN_USER=%s\nGRAFANA_ADMIN_PASSWORD=%s\nGRAFANA_ROOT_URL=%s\nOPS_KEY=%s\nOPSBOT_ALLOWED_CHATS=%s\nOPSBOT_ALLOWED_USERS=%s\n" \
              "${TELEGRAM_BOT_TOKEN}" \
              "${TELEGRAM_CHAT_ID}" \
              "${GRAFANA_ADMIN_USER:-admin}" \
              "${GRAFANA_ADMIN_PASSWORD}" \
              "${GRAFANA_ROOT_URL:-http://localhost:3000}" \
              "${OPS_KEY}" \
              "${OPSBOT_ALLOWED_CHATS:-}" \
              "${OPSBOT_ALLOWED_USERS:-}" > .env.monitoring
            chmod 600 .env.monitoring

            # Rules are validated before they are applied. Prometheus starts
            # happily with a rule that does not parse — it simply never
            # evaluates it, which is the one failure mode monitoring must not
            # have.
            echo "Validating Prometheus configuration and alert rules..."
            make monitoring-check

            echo "Starting/updating monitoring containers..."
            make monitoring-up

            # A changed bind-mounted file does not recreate a container, so
            # neither of these picks up an edit on its own: Alertmanager renders
            # its config from the template at start, and Prometheus re-reads
            # rules only when asked.
            echo "Applying configuration changes..."
            docker restart healthlogin_alertmanager >/dev/null
            sleep 5
            make monitoring-reload

            echo "Monitoring deployment finished successfully."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
          OPSBOT_ALLOWED_CHATS: ${{ vars.OPSBOT_ALLOWED_CHATS }}
          OPSBOT_ALLOWED_USERS: ${{ vars.OPSBOT_ALLOWED_USERS }}
