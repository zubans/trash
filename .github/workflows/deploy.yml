name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/healthlogin-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/healthlogin-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify Backend Builds
        run: |
          cd backend
          go build ./...

      - name: Vet Backend
        run: |
          cd backend
          go vet ./...

      - name: Run Backend Tests
        run: |
          cd backend
          go test -race ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed once, before both steps that need node_modules.
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck Frontend
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd frontend
          npx vitest run

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOCKER_USERNAME,DB_USER,DB_PASSWORD,DB_NAME,JWT_SECRET,SMTP_PASSWORD,SMTP_USER,SMTP_HOST,CORS_ORIGIN,APP_BASE_URL,DADATA_API_KEY
          script: |
            set -e
            cd /home/user/.openclaw/workspace/worktrees/trash || exit 1
            echo "Fetching latest repository files..."
            git pull origin main
            
            # Write production .env file from GitHub Actions secrets & variables
            echo "Writing production .env file from GitHub Secrets..."
            printf "DOCKER_USERNAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_NAME=%s\nJWT_SECRET=%s\nSMTP_PASSWORD=%s\nSMTP_USER=%s\nSMTP_HOST=%s\nCORS_ORIGIN=%s\nAPP_BASE_URL=%s\nDADATA_API_KEY=%s\n" \
              "${DOCKER_USERNAME}" \
              "${DB_USER:-healthlogin}" \
              "${DB_PASSWORD}" \
              "${DB_NAME:-healthlogin}" \
              "${JWT_SECRET}" \
              "${SMTP_PASSWORD}" \
              "${SMTP_USER:-system@moya-usluga.ru}" \
              "${SMTP_HOST:-mailserver}" \
              "${CORS_ORIGIN:-https://moya-usluga.ru}" \
              "${APP_BASE_URL:-https://moya-usluga.ru}" \
              "${DADATA_API_KEY}" > .env
            chmod 600 .env

            echo "Restarting services via make restart..."
            make restart
            
            echo "Building and releasing new Android APK on server..."
            COMMIT_MSG=$(git log -1 --pretty=%B)
            make release-android RELEASE_NOTES="${COMMIT_MSG}" || echo "Notice: Android release build skipped or failed on server."
            
            echo "Cleaning up old images..."
            docker image prune -af --filter "until=168h"
            
            echo "Deployment finished successfully."
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER }}
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || secrets.CORS_ORIGIN }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.APP_BASE_URL }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
