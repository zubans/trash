services:
  db:
    image: postgres:16-alpine
    container_name: healthlogin_db
    environment:
      POSTGRES_USER: ${DB_USER:-healthlogin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthlogin}
      POSTGRES_DB: ${DB_NAME:-healthlogin}
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    image: ${DOCKER_USERNAME:-healthlogin}/healthlogin-backend:${BACKEND_TAG:-latest}
    container_name: healthlogin_backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-healthlogin}
      DB_PASSWORD: ${DB_PASSWORD:-healthlogin}
      DB_NAME: ${DB_NAME:-healthlogin}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://moya-usluga.ru:8443}
      JWT_SECRET: ${JWT_SECRET}
      TLS_CERT_FILE: /app/certs/localhost-cert.pem
      TLS_KEY_FILE: /app/certs/localhost-key.pem
      MOBILE_HTTP_ADDR: :8081
      RELEASES_BASE_URL: ${RELEASES_BASE_URL:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      ACCEPT_RADIUS_KM: ${ACCEPT_RADIUS_KM:-0.5}
    depends_on:
      - db
    volumes:
      - ./releases:/app/releases
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
      # Plain HTTP port for mobile apps. Maps to MOBILE_HTTP_ADDR (:8081) inside
      # the container so Android builds can use http://<server-ip>:8089 without
      # dealing with self-signed TLS certificates in production.
      - "8089:8081"

  frontend:
    image: ${DOCKER_USERNAME:-healthlogin}/healthlogin-frontend:${FRONTEND_TAG:-latest}
    container_name: healthlogin_frontend
    depends_on:
      - backend
    ports:
      - "8443:443"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  default:
    driver: bridge
