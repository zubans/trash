# Maddy Mail Server Configuration
#
# This Maddy instance sends mail directly for the production domain moya-usluga.ru.
# moya-usluga.ru is NOT treated as a local domain here; messages are delivered
# directly to recipients' MX servers using the identity mail.moya-usluga.ru.
#
# Flow: backend (docker network) -> Maddy :587 -> recipients' MX servers

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_PRIMARY_DOMAIN}

state_dir /var/lib/maddy
runtime_dir /run/maddy

hostname $(hostname)

tls off

# Internal authentication database used ONLY for backend submission auth.
# Credentials are stored in a persistent SQLite DB (maddy_data volume).
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn /var/lib/maddy/credentials.db
        table_name credentials
    }
}

# Direct outbound delivery to recipients' MX servers.
# The hostname is used in EHLO/HELO and in Received headers.
target.remote outbound_delivery {
    hostname $(hostname)
}

# Routing pipeline: every message is delivered directly.
msgpipeline outbound_routing {
    default_destination {
        deliver_to &outbound_delivery
    }
}

# Inbound routing pipeline to accept callback checks safely and discard inbound mail
msgpipeline inbound_routing {
    destination 0.0.0.0/0 {
        reject 250 2.0.0 "OK"
    }
}

# SMTP inbound listener (port 25).
# Handles MX callback checks from Yandex/Mail.ru without rejecting with 550.
smtp tcp://0.0.0.0:25 {
    limits {
        all rate 20 1s
    }
    dmarc no
    default_source {
        deliver_to &inbound_routing
    }
}

# Submission endpoint for the backend (port 587).
# Authenticated clients can send from system@moya-usluga.ru;
# Maddy will deliver the messages directly to the Internet.
submission tcp://0.0.0.0:587 {
    auth &local_authdb
    insecure_auth yes
    default_source {
        deliver_to &outbound_routing
    }
}
