# Maddy Mail Server Configuration for moya-usluga.ru

$(hostname) = moya-usluga.ru
$(primary_domain) = moya-usluga.ru

state_dir /var/lib/maddy
runtime_dir /run/maddy

tls off

# Internal authentication database & storage
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn /var/lib/maddy/credentials.db
        table_name credentials
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /var/lib/maddy/imapsql.db
}

# Outbound delivery target for external emails (mail.ru, yandex.ru, etc.)
target.remote outbound_delivery {
    hostname $(hostname)
}

# Internal & External routing pipeline
msgpipeline local_routing {
    destination $(primary_domain) {
        deliver_to &local_mailboxes
    }
    default_destination {
        deliver_to &outbound_delivery
    }
}

# SMTP Inbound / Local Delivery
hostname $(hostname)

smtp tcp://0.0.0.0:25 {
    limits {
        all rate 20 1s
    }
    dmarc no
    source $(primary_domain) {
        reject 550 5.7.0 "Local address forgery prohibited"
    }
    default_source {
        destination postmaster $(primary_domain) {
            deliver_to &local_mailboxes
        }
        default_destination {
            deliver_to &local_routing
        }
    }
}

# Submission Endpoint for Backend (Port 587)
submission tcp://0.0.0.0:587 {
    auth &local_authdb
    insecure_auth yes
    source $(primary_domain) {
        destination postmaster $(primary_domain) {
            deliver_to &local_mailboxes
        }
        default_destination {
            deliver_to &local_routing
        }
    }
    default_source {
        reject 550 5.7.1 "Sender domain not allowed"
    }
}
