services:
  db:
    image: postgres:16-alpine
    container_name: healthlogin_db
    environment:
      POSTGRES_USER: ${DB_USER:-healthlogin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-healthlogin}
    # Migrations are applied by the backend on start (repository.Migrate), not by
    # the entrypoint init scripts: those only run once on an empty volume, which
    # is why schema changes used to be patched in from Go code at runtime.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The database is reachable only from the compose network. Publish 5432 to
    # 127.0.0.1 locally if you need psql from the host, never to 0.0.0.0.
    expose:
      - "5432"

  mailserver:
    image: foxcpp/maddy:0.7.0
    container_name: healthlogin_mail
    hostname: mail.moya-usluga.ru
    environment:
      MADDY_HOSTNAME: mail.moya-usluga.ru
      MADDY_PRIMARY_DOMAIN: moya-usluga.ru
    volumes:
      - ./maddy.conf:/data/maddy.conf:ro
      - maddy_data:/var/lib/maddy
    ports:
      - "25:25"
      - "587:587"
      - "143:143"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthlogin_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-healthlogin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-healthlogin}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://moya-usluga.ru}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TLS_CERT_FILE: /app/certs/localhost-cert.pem
      TLS_KEY_FILE: /app/certs/localhost-key.pem
      MOBILE_HTTP_ADDR: :8081
      # Serve the API at the root as well, for installed APKs built before the
      # /api prefix. Set to 0 once every client is rebuilt.
      LEGACY_ROOT_ROUTES: ${LEGACY_ROOT_ROUTES:-1}
      RELEASES_BASE_URL: ${RELEASES_BASE_URL:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      ACCEPT_RADIUS_KM: ${ACCEPT_RADIUS_KM:-0.5}
      # Address suggestions. Without it /geo/suggest answers 503 and nobody can
      # finish registration, so it is required rather than defaulted.
      DADATA_API_KEY: ${DADATA_API_KEY:?DADATA_API_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-system@moya-usluga.ru}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:-system@moya-usluga.ru}
      APP_BASE_URL: ${APP_BASE_URL:-https://moya-usluga.ru}
      # VLESS fallback endpoint list, served encrypted at /api/app/endpoints.
      # APP_ENDPOINTS_KEY gates access (X-App-Key header); APP_ENDPOINTS_ENC_KEY
      # is the 32-byte (64 hex) AES-256-GCM key. Both must match the values
      # embedded in the Android build (see frontend/android .../net/Secrets.java).
      APP_ENDPOINTS_KEY: ${APP_ENDPOINTS_KEY:?APP_ENDPOINTS_KEY is required}
      APP_ENDPOINTS_ENC_KEY: ${APP_ENDPOINTS_ENC_KEY:?APP_ENDPOINTS_ENC_KEY is required}
      APP_ENDPOINTS_FILE: /app/vless-endpoints.json
      # Prometheus scrape target, on its own listener. Reachable only from the
      # compose network — it is never published to the host and nginx does not
      # proxy it. Set to an empty value to turn metrics off entirely.
      METRICS_ADDR: ${METRICS_ADDR:-:9091}
      # Gates the /internal/* routes on the metrics listener, used by the ops
      # bot to force a reconciliation. Unset means those routes do not exist.
      OPS_KEY: ${OPS_KEY:-}
      # Surfaces in healthlogin_build_info so a dashboard can answer "which
      # build is actually running right now?".
      APP_VERSION: ${BACKEND_TAG:-dev}
    depends_on:
      - db
      - mailserver
    volumes:
      - ./releases:/app/releases
      - uploads_data:/app/uploads
      - ./certs:/app/certs:ro
      # Plaintext endpoint list, read by the backend and served only encrypted.
      # Edit it and the change is live on the next app poll; no rebuild needed.
      - ./vless-endpoints.json:/app/vless-endpoints.json:ro
    # 8080 is the TLS listener used by the host; 8081 stays inside the compose
    # network for nginx (it is plain HTTP and must not be published).
    expose:
      - "8081"
      - "9091"
    ports:
      - "127.0.0.1:8088:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: healthlogin_frontend
    depends_on:
      - backend
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  maddy_data:
    driver: local

networks:
  default:
    driver: bridge
