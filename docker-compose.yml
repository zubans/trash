services:
  db:
    image: postgres:16-alpine
    container_name: healthlogin_db
    environment:
      POSTGRES_USER: ${DB_USER:-healthlogin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-healthlogin}
    # Migrations are applied by the backend on start (repository.Migrate), not by
    # the entrypoint init scripts: those only run once on an empty volume, which
    # is why schema changes used to be patched in from Go code at runtime.
    #
    # The stock image ships development defaults (128MB shared_buffers, 4MB
    # work_mem) that do not reflect the host. The values below assume a few GB of
    # RAM and are deliberately modest, because this container shares the machine
    # with the backend, nginx, the mail server and the monitoring stack.
    #
    # max_connections is 200 against an application pool of 25 (DB_MAX_OPEN_CONNS):
    # the headroom is for the workers' own traffic, a migration run, psql and the
    # postgres_exporter, not for the application to grow into.
    #
    # pg_stat_statements is what makes a load test readable afterwards — without
    # it there is no record of which query burned the time.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=200ms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The database is reachable only from the compose network. Publish 5432 to
    # 127.0.0.1 locally if you need psql from the host, never to 0.0.0.0.
    expose:
      - "5432"

  mailserver:
    image: foxcpp/maddy:0.7.0
    container_name: healthlogin_mail
    hostname: mail.moya-usluga.ru
    environment:
      MADDY_HOSTNAME: mail.moya-usluga.ru
      MADDY_PRIMARY_DOMAIN: moya-usluga.ru
    volumes:
      - ./maddy.conf:/data/maddy.conf:ro
      - maddy_data:/var/lib/maddy
    ports:
      - "25:25"
      - "587:587"
      - "143:143"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthlogin_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-healthlogin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-healthlogin}
      # Upper bound on connections this process opens. Without a bound a client
      # surge exhausts max_connections and the database starts refusing
      # connections outright; with one, the queue forms in the process and shows
      # up in the pool metrics instead.
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      # Tuning knobs for the caches on the request path. Each has a working
      # default in the code; they are listed here so a value set in .env
      # actually reaches the process — compose passes through only what is
      # named, so an unlisted variable would sit in .env doing nothing.
      #
      # Each one trades freshness for load, and the trade is bounded: writes
      # made by this process invalidate its own caches, so the TTL only covers
      # changes it did not make.
      AUTH_CACHE_TTL_SEC: ${AUTH_CACHE_TTL_SEC:-5}
      SETTINGS_CACHE_TTL_SEC: ${SETTINGS_CACHE_TTL_SEC:-10}
      CATALOG_CACHE_TTL_SEC: ${CATALOG_CACHE_TTL_SEC:-60}
      # Ceiling on simultaneous calls to the address provider. Past it, address
      # entry answers 429 instead of piling up goroutines while DaData is slow.
      DADATA_MAX_CONCURRENCY: ${DADATA_MAX_CONCURRENCY:-8}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://moya-usluga.ru}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TLS_CERT_FILE: /app/certs/localhost-cert.pem
      TLS_KEY_FILE: /app/certs/localhost-key.pem
      MOBILE_HTTP_ADDR: :8081
      # Serve the API at the root as well, for installed APKs built before the
      # /api prefix. Set to 0 once every client is rebuilt.
      LEGACY_ROOT_ROUTES: ${LEGACY_ROOT_ROUTES:-1}
      RELEASES_BASE_URL: ${RELEASES_BASE_URL:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      ACCEPT_RADIUS_KM: ${ACCEPT_RADIUS_KM:-0.5}
      # Address suggestions. Without it /geo/suggest answers 503 and nobody can
      # finish registration, so it is required rather than defaulted.
      DADATA_API_KEY: ${DADATA_API_KEY:?DADATA_API_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-system@moya-usluga.ru}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:-system@moya-usluga.ru}
      APP_BASE_URL: ${APP_BASE_URL:-https://moya-usluga.ru}
      # Prometheus scrape target, on its own listener. Reachable only from the
      # compose network — it is never published to the host and nginx does not
      # proxy it. Set to an empty value to turn metrics off entirely.
      METRICS_ADDR: ${METRICS_ADDR:-:9091}
      # Gates the /internal/* routes on the metrics listener, used by the ops
      # bot to force a reconciliation. Unset means those routes do not exist.
      OPS_KEY: ${OPS_KEY:-}
      # Surfaces in healthlogin_build_info so a dashboard can answer "which
      # build is actually running right now?".
      APP_VERSION: ${BACKEND_TAG:-dev}
    depends_on:
      - db
      - mailserver
    volumes:
      - ./releases:/app/releases
      - uploads_data:/app/uploads
      - ./certs:/app/certs:ro
    # 8080 is the TLS listener used by the host; 8081 stays inside the compose
    # network for nginx (it is plain HTTP and must not be published).
    expose:
      - "8081"
      - "9091"
    ports:
      - "127.0.0.1:8088:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: healthlogin_frontend
    depends_on:
      - backend
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  maddy_data:
    driver: local

networks:
  default:
    driver: bridge
