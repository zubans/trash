services:
  db:
    image: postgres:16-alpine
    container_name: healthlogin_db
    environment:
      POSTGRES_USER: healthlogin
      POSTGRES_PASSWORD: healthlogin
      POSTGRES_DB: healthlogin
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthlogin_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: healthlogin
      DB_PASSWORD: healthlogin
      DB_NAME: healthlogin
      CORS_ORIGIN: ${CORS_ORIGIN:-https://moya-usluga.ru:8443}
      JWT_SECRET: ${JWT_SECRET}
      TLS_CERT_FILE: /app/certs/localhost-cert.pem
      TLS_KEY_FILE: /app/certs/localhost-key.pem
      MOBILE_HTTP_ADDR: :8081
      RELEASES_BASE_URL: ${RELEASES_BASE_URL:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      ACCEPT_RADIUS_KM: ${ACCEPT_RADIUS_KM:-0.5}
    depends_on:
      - db
    volumes:
      - ./releases:/app/releases
      - uploads_data:/app/uploads
    ports:
      - "8088:8080"
      - "8089:8081"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: healthlogin_frontend
    depends_on:
      - backend
    ports:
      - "8443:443"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  default:
    driver: bridge
