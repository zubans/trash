services:
  db:
    image: postgres:16-alpine
    container_name: healthlogin_db
    environment:
      POSTGRES_USER: healthlogin
      POSTGRES_PASSWORD: healthlogin
      POSTGRES_DB: healthlogin
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mailserver:
    image: foxcpp/maddy:0.7.0
    container_name: healthlogin_mail
    hostname: mail.moya-usluga.ru
    environment:
      MADDY_HOSTNAME: mail.moya-usluga.ru
      MADDY_PRIMARY_DOMAIN: moya-usluga.ru
    volumes:
      - ./maddy.conf:/data/maddy.conf:ro
      - maddy_data:/var/lib/maddy
    ports:
      - "25:25"
      - "587:587"
      - "143:143"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthlogin_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: healthlogin
      DB_PASSWORD: healthlogin
      DB_NAME: healthlogin
      CORS_ORIGIN: ${CORS_ORIGIN:-https://moya-usluga.ru}
      JWT_SECRET: ${JWT_SECRET}
      TLS_CERT_FILE: /app/certs/localhost-cert.pem
      TLS_KEY_FILE: /app/certs/localhost-key.pem
      MOBILE_HTTP_ADDR: :8081
      RELEASES_BASE_URL: ${RELEASES_BASE_URL:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      ACCEPT_RADIUS_KM: ${ACCEPT_RADIUS_KM:-0.5}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-system@moya-usluga.ru}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-systempass123}
      SMTP_FROM: ${SMTP_FROM:-system@moya-usluga.ru}
      APP_BASE_URL: ${APP_BASE_URL:-https://moya-usluga.ru}
    depends_on:
      - db
      - mailserver
    volumes:
      - ./releases:/app/releases
      - uploads_data:/app/uploads
      - ./certs:/app/certs:ro
    ports:
      - "8088:8080"
      - "8089:8081"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: healthlogin_frontend
    depends_on:
      - backend
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  maddy_data:
    driver: local

networks:
  default:
    driver: bridge
