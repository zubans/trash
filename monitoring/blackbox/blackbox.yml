modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      # The public certificate is a real one; a probe that skipped verification
      # would keep reporting success right through an expiry.
      tls_config:
        insecure_skip_verify: false

  # Same check, for hosts still on a self-signed certificate. Kept separate so
  # nobody relaxes verification on the public endpoint by editing one line.
  http_2xx_insecure_tls:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

  smtp_banner:
    prober: tcp
    timeout: 10s
    tcp:
      query_response:
        - expect: "^220 "

  tcp_connect:
    prober: tcp
    timeout: 5s
