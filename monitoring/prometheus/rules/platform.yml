# Alerting rules for the application and the infrastructure under it.
#
# Two severities, and they mean different things:
#   page     — users are affected right now, or money is at stake.
#   ticket   — worth fixing this week; routed to the same chat, without urgency.
#
# Every rule carries a `for` long enough to survive a deploy or a restart.
groups:
  - name: availability
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Бэкенд не отвечает на сбор метрик"
          description: "Prometheus не может собрать метрики с {{ $labels.instance }} более 2 минут. Либо процесс упал, либо метрик-листенер не поднялся."

      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox_http"} == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "Публичный адрес {{ $labels.instance }} недоступен"
          description: "Внешняя проверка не проходит 3 минуты. Бэкенд может быть жив — сначала посмотрите nginx и сертификат."

      - alert: TLSCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Сертификат {{ $labels.instance }} истекает через {{ $value | printf \"%.0f\" }} дней"
          description: "Продлите сертификат. После 0 дней это станет полным отказом сервиса, а не тикетом."

      - alert: MailSubmissionDown
        expr: probe_success{job="blackbox_smtp", instance="mailserver:587"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Maddy не принимает почту на 587"
          description: "Без submission не уходят письма подтверждения и коды сброса пароля — регистрация останавливается."

  - name: application
    rules:
      # The volume floor is not decoration. This platform serves a handful of
      # requests a minute at night, where two failures out of twenty-one is
      # already 9.5% — a ratio alone would page somebody for noise, and a
      # channel that pages for noise stops being read. Below ~6 requests a
      # minute the ratio means nothing; a real outage at that volume is caught
      # by BackendDown and PublicEndpointDown instead.
      - alert: HighServerErrorRate
        expr: |
          sum(rate(healthlogin_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(healthlogin_http_requests_total[5m])) > 0.05
          and
          sum(rate(healthlogin_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Более 5% запросов отвечают 5xx"
          description: "Текущая доля: {{ $value | humanizePercentage }}. Смотрите разбивку по маршрутам на дашборде Backend."

      # Low traffic must not mean invisible errors, only quieter ones: the same
      # failures still surface here, as a ticket, without a volume floor.
      - alert: ServerErrorsAtLowTraffic
        expr: |
          sum(rate(healthlogin_http_requests_total{status=~"5.."}[15m])) > 0
          and
          sum(rate(healthlogin_http_requests_total[5m])) <= 0.1
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Стабильные 5xx на низком трафике"
          description: "Ошибок мало в абсолютных числах, поэтому это не page — но они не прекращаются полчаса. Разбивка по маршрутам на дашборде Backend."

      - alert: SlowAPI
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(healthlogin_http_request_duration_seconds_bucket[5m]))
          ) > 3
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "p95 маршрута {{ $labels.route }} превышает 3 секунды"
          description: "Держится 10 минут. Обычно это база или внешний адресный сервис."

      - alert: DatabasePoolSaturated
        expr: |
          go_sql_blocked_seconds_total{db_name="main"} > 0
          and rate(go_sql_blocked_seconds_total{db_name="main"}[5m]) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Запросы ждут свободного соединения с базой"
          description: "Пул исчерпан: каждую секунду больше секунды суммарного ожидания. Это выглядит как медленная база, но лечится размером пула или запросами."

      - alert: AddressProviderFailing
        expr: |
          sum(rate(healthlogin_upstream_requests_total{upstream="dadata", result!="ok"}[10m]))
            / sum(rate(healthlogin_upstream_requests_total{upstream="dadata"}[10m])) > 0.2
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "DaData отвечает ошибками более чем на 20% запросов"
          description: "Без подсказок адреса регистрацию невозможно завершить. Проверьте ключ и квоту: результат {{ $labels.result }}."

      - alert: SystemMailFailing
        expr: |
          sum(rate(healthlogin_mail_sends_total{result="error"}[15m])) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Системная почта не уходит ({{ $labels.kind }})"
          description: "Письма подтверждения и коды сброса пароля не доставляются. Пользователь этого не видит — он видит, что код «не пришёл»."

      # Only the workers that run on a short timer. Their intervals are 5s
      # (matching), 30s (sla) and 1m (auction, shift_autoclose), so fifteen
      # minutes of silence from any of them is real.
      #
      # reconcile is excluded because it runs once a day: a single threshold
      # across every worker fired on it about twenty minutes after each restart
      # and then never stopped. Its own staleness is covered, with the right
      # horizon, by ReconciliationNotRunning below.
      - alert: BackgroundWorkerStalled
        expr: |
          time() - max by (worker) (healthlogin_worker_last_success_timestamp_seconds{worker!="reconcile"}) > 900
          and on() up{job="backend"} == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Фоновый обработчик {{ $labels.worker }} не отрабатывал 15 минут"
          description: "Процесс жив, но проход не завершался успешно. matching — заказы не назначаются; shift_autoclose — смены не закрываются; sla — срочные заказы не понижаются; auction — просроченные аукционы не отменяются."

      - alert: OrdersQueuedWithNoExecutors
        expr: healthlogin_orders_searching > 0 and healthlogin_shifts_active == 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Заказы ждут, а на смене никого нет"
          description: "{{ $value }} заказов в поиске полчаса без единого исполнителя на смене. Технически всё исправно — работать некому."

  - name: money
    rules:
      # The reconciliation pass is the one thing that can prove the books are
      # intact. A drift here is never a monitoring artefact: it is somebody's
      # money in the wrong place.
      # The second clause is belt and braces next to the NaN starting value in
      # the metric itself: this alert must only ever speak about a pass that
      # actually completed. A pass that could not run is not evidence about the
      # books, and paging on it teaches people to distrust the one alert that
      # must never be ignored.
      - alert: LedgerDrift
        expr: |
          healthlogin_reconcile_ok == 0
          and healthlogin_reconcile_last_run_timestamp_seconds > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Сверка балансов нашла расхождение"
          description: "Баланс разошёлся с журналом транзакций. Не правьте баланс — ищите операцию, которая его сдвинула: /admin/finances/reconciliation."

      # Guarded the same way: before the first completed pass the timestamp is
      # zero, and "time() - 0" is thirty-odd years, which would fire this on
      # every fresh deployment. ReconciliationFailing below covers that case.
      - alert: ReconciliationNotRunning
        expr: |
          time() - healthlogin_reconcile_last_run_timestamp_seconds > 172800
          and healthlogin_reconcile_last_run_timestamp_seconds > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Сверка балансов не проходила больше двух суток"
          description: "Она запускается раз в сутки. Отсутствие расхождений сейчас не значит ничего — их просто никто не искал."

      # A pass that keeps erroring leaves every gauge above untouched, so the
      # books look exactly as they did — which is to say, unverified. This is
      # the only rule that notices.
      #
      # Stated as "has failed at least once and has never completed", not as a
      # rate over a window: this worker runs once a day, and a 3h window would
      # be empty almost all the time — the same mistake that made the generic
      # worker-stall threshold fire on it forever.
      - alert: ReconciliationFailing
        expr: |
          healthlogin_reconcile_failures_total > 0
          and healthlogin_reconcile_last_run_timestamp_seconds == 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Сверка балансов не может отработать"
          description: "Проход завершается ошибкой, поэтому расхождений не видно — не потому, что их нет, а потому, что их никто не искал. Смотрите логи бэкенда: [ReconcileWorker] reconciliation failed."

      - alert: LedgerWriteErrors
        expr: sum(rate(healthlogin_ledger_errors_total[10m])) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Записи в финансовый журнал падают с ошибкой"
          description: "Тип операции: {{ $labels.op }}. Транзакция откатывается целиком, но повторяющаяся ошибка означает, что деньги не двигаются вообще."

  - name: security
    rules:
      - alert: CredentialStuffingSuspected
        expr: sum(rate(healthlogin_auth_events_total{event="login", result="denied"}[5m])) > 2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Всплеск неудачных входов"
          description: "Более 2 отказов в секунду в течение 10 минут. Ограничитель частоты работает, но всплеск стоит посмотреть."

      - alert: EndpointListProbedWithWrongKey
        expr: sum(rate(healthlogin_app_endpoints_requests_total{result="forbidden"}[10m])) > 0.2
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Список VLESS-endpoint'ов запрашивают с неверным ключом"
          description: "Либо в обращении осталась старая сборка приложения с прежним APP_KEY, либо URL нашли снаружи."

  - name: resources
    rules:
      # Absolute bytes, not a percentage. On a 914G volume ten percent is 91G —
      # an alert that fires while there is more free space than the whole
      # database will ever use, which is how a channel gets muted. What matters
      # is whether there is room to write, and that is a number of gigabytes.
      - alert: HostDiskFillingUp
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} < 10 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "На {{ $labels.mountpoint }} осталось меньше 10 ГБ"
          description: "Свободно {{ $value | humanize1024 }}B. Полный диск останавливает PostgreSQL и загрузку вложений. Кандидаты на чистку: releases/, uploads/, docker builder prune, docker image prune."

      # Early warning, so the page above is never the first anyone hears of it.
      # A ticket at 25G leaves days of room to act rather than minutes.
      - alert: HostDiskLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} < 25 * 1024 * 1024 * 1024
        for: 2h
        labels:
          severity: ticket
        annotations:
          summary: "На {{ $labels.mountpoint }} осталось меньше 25 ГБ"
          description: "Свободно {{ $value | humanize1024 }}B. Ещё не срочно, но пора чистить: releases/ копит APK на каждый деплой, а docker — образы и build cache."

      - alert: HostMemoryPressure
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Свободной памяти меньше 10%"
          description: "Следующим шагом OOM killer выберет процесс сам, и обычно это PostgreSQL."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "PostgreSQL недоступен"
          description: "Экспортер не может подключиться к базе. Без неё бэкенд не отвечает ни на один запрос с данными."

      - alert: ContainerRestartLoop
        expr: |
          increase(container_start_time_seconds{name=~"healthlogin_.*"}[15m]) > 0
          and changes(container_start_time_seconds{name=~"healthlogin_.*"}[1h]) > 3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Контейнер {{ $labels.name }} перезапускается по кругу"
          description: "Более трёх стартов за час. Обычно это падение на старте: смотрите docker logs."
