# Alerting rules for the VLESS fallback channel.
#
# The rules are deliberately asymmetric. One dead endpoint is normal operations:
# the app walks the list and moves on, and paging somebody for it would train
# them to ignore this channel. Zero usable endpoints is the outage — at that
# point a blocked client has nowhere left to go, and it is invisible from every
# other metric in the stack, because the backend itself is perfectly healthy.
groups:
  - name: vless_fallback
    rules:
      - alert: VlessFallbackChannelDown
        expr: vless_endpoints_usable == 0 and vless_endpoints_total > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Ни один VLESS-endpoint не работает"
          description: "Резервный канал приложения не работает целиком. Клиенты, у которых заблокирован прямой путь до API, не могут пользоваться приложением вообще."

      - alert: VlessFallbackChannelDegraded
        expr: |
          vless_endpoints_usable > 0
          and vless_endpoints_usable < vless_endpoints_total
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Часть VLESS-endpoint'ов недоступна ({{ $value }} из {{ with query \"vless_endpoints_total\" }}{{ . | first | value }}{{ end }})"
          description: "Канал ещё работает за счёт оставшихся серверов. Запас на исходе — почините или замените выпавшие."

      - alert: VlessEndpointDown
        expr: vless_endpoint_up == 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Endpoint {{ $labels.remarks }} ({{ $labels.address }}) не принимает соединения"
          description: "TCP-подключение не устанавливается 15 минут. Сервер выключен, переехал или порт заблокирован."

      # The check that separates "the port answers" from "the proxy works".
      - alert: VlessTunnelBroken
        expr: vless_endpoint_up == 1 and vless_tunnel_up == 0
        for: 20m
        labels:
          severity: ticket
        annotations:
          summary: "Endpoint {{ $labels.remarks }} отвечает, но не проксирует"
          description: "Порт открыт, а запрос через туннель не проходит. Обычно это разъехавшиеся ключи Reality/UUID между сервером и списком в vless-endpoints.json."

      - alert: VlessEndpointCertExpiringSoon
        expr: (vless_endpoint_cert_expiry_timestamp_seconds - time()) / 86400 < 14
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Сертификат endpoint'а {{ $labels.remarks }} истекает через {{ $value | printf \"%.0f\" }} дней"
          description: "Относится только к endpoint'ам на обычном TLS; у Reality сертификат чужой и здесь не проверяется."

      - alert: VlessTunnelSlow
        expr: vless_tunnel_request_duration_seconds > 15
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Туннель {{ $labels.remarks }} медленный: {{ $value | printf \"%.1f\" }} с"
          description: "Формально работает, но при такой задержке приложение через него практически неюзабельно."

  - name: vless_control_plane
    rules:
      # The list is how a client learns where to go. If it stops being served,
      # every endpoint can be perfectly healthy and new clients still fail.
      - alert: VlessEndpointListUnavailable
        expr: vless_config_fetch_up == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Список endpoint'ов не отдаётся или не расшифровывается"
          description: "Проверьте APP_ENDPOINTS_KEY / APP_ENDPOINTS_ENC_KEY на сервере и то, что vless-endpoints.json смонтирован и читается."

      # Aggregated to a single label-free series on purpose. The two metrics
      # come from two different scrape targets, so the unaggregated form
      # produced two alerts with different instance and service labels — and
      # the grouping then delivered the same news twice, once "backend:9091"
      # and once "vlessprobe:9102". One empty list is one problem.
      - alert: VlessEndpointListEmpty
        expr: max(vless_config_count) == 0 or max(healthlogin_app_endpoints_configs) == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Список endpoint'ов пуст"
          description: "Худший случай: запрос отвечает 200, а падать клиенту некуда. Скорее всего файл перезаписали пустым или сломали JSON."

      - alert: VlessProbeStalled
        expr: time() - vless_probe_last_pass_timestamp_seconds > 600
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Проба VLESS не отрабатывала 10 минут"
          description: "Метрики каналов устарели: то, что тревог нет, сейчас ничего не доказывает."

      - alert: VlessProbeNotEndToEnd
        expr: vless_probe_e2e_enabled == 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Проба VLESS работает без xray"
          description: "Проверяются только TCP и TLS. Endpoint, у которого открыт порт, но сломан прокси, сейчас выглядит исправным."

      # A rising rate here is the users' own answer to "is the direct path
      # working?". It is the earliest warning that the app is being blocked.
      - alert: VlessFallbackDemandSpike
        expr: |
          sum(rate(healthlogin_app_endpoints_requests_total{result="ok"}[15m]))
            > 3 * sum(rate(healthlogin_app_endpoints_requests_total{result="ok"}[24h] offset 24h))
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Резко выросли запросы списка резервных endpoint'ов"
          description: "Приложения массово запрашивают резервный канал — обычно это значит, что прямой путь до API у части пользователей закрыт. Само по себе не поломка, но повод проверить доступность снаружи."
