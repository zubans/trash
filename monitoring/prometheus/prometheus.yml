# Prometheus scrape configuration for the healthlogin stack.
#
# Everything here is scraped over the compose network by container name. None of
# these ports are published to the host or proxied by nginx: a metrics endpoint
# enumerates the shape of the system and belongs behind the same boundary as the
# database.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The application itself: HTTP, the ledger, the workers and the endpoint list.
  - job_name: backend
    static_configs:
      - targets: ['backend:9091']
        labels:
          service: backend

  # The VLESS fallback channel, probed end to end. Slower than the rest because
  # a pass starts an xray process per endpoint; the interval must stay above the
  # time one full pass takes.
  - job_name: vlessprobe
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['vlessprobe:9102']
        labels:
          service: vpn_fallback

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: host

  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: docker

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: database

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: frontend

  # Black-box checks run from inside the network. They answer "does the public
  # entry point work", which the in-process metrics cannot: a backend that is
  # perfectly healthy is still down for users when nginx or TLS is broken.
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://moya-usluga.ru/health
          - https://moya-usluga.ru/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Mail submission. Maddy has no exporter, and a TCP banner check is the honest
  # amount of certainty available: it proves the daemon is listening and
  # answering, which is what the backend needs from it.
  - job_name: blackbox_smtp
    metrics_path: /probe
    params:
      module: [smtp_banner]
    static_configs:
      - targets:
          - mailserver:587
          - mailserver:25
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
